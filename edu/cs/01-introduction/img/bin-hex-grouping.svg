<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">2進法と16進法の変換: 小数点から4桁ずつ区切る</title><desc id="desc">2進法11010は上位に0を補って0001 1010と区切り、各4桁を16進法の1桁1とAに置き換えて1A。小数0.101は右に0を補って0.1010とし、0.A。</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="38" font-size="24" fill="#233647" text-anchor="start" font-weight="700">2進法 ⇄ 16進法: 小数点を基準に4桁ずつ区切る(2⁴ = 16)</text>
<text x="28" y="104" font-size="19" fill="#2166ac" text-anchor="start" font-weight="700">整数: 11010₍₂₎</text>
<rect x="250" y="68" width="118" height="58" rx="6" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="309" y="109" font-size="28" fill="#233647" text-anchor="middle" font-weight="700" font-family="monospace">0001</text>
<rect x="388" y="68" width="118" height="58" rx="6" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="447" y="109" font-size="28" fill="#233647" text-anchor="middle" font-weight="700" font-family="monospace">1010</text>
<line x1="309" y1="134" x2="309" y2="166" stroke="#2166ac" stroke-width="2.2"/>
<path d="M 313.9 157.0 L 309 166 L 304.1 157.0" fill="none" stroke="#2166ac" stroke-width="2.2" stroke-linejoin="round"/>
<text x="309" y="202" font-size="30" fill="#2166ac" text-anchor="middle" font-weight="700">1</text>
<line x1="447" y1="134" x2="447" y2="166" stroke="#2166ac" stroke-width="2.2"/>
<path d="M 451.9 157.0 L 447 166 L 442.1 157.0" fill="none" stroke="#2166ac" stroke-width="2.2" stroke-linejoin="round"/>
<text x="447" y="202" font-size="30" fill="#2166ac" text-anchor="middle" font-weight="700">A</text>
<text x="536" y="110" font-size="17" fill="#5a6b7b" text-anchor="start">← 左に0を補う</text>
<text x="536" y="202" font-size="20" fill="#233647" text-anchor="start" font-weight="700">= 1A₍₁₆₎</text>
<text x="28" y="264" font-size="19" fill="#2166ac" text-anchor="start" font-weight="700">小数: 0.101₍₂₎</text>
<rect x="250" y="228" width="118" height="58" rx="6" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="309" y="269" font-size="28" fill="#233647" text-anchor="middle" font-weight="700" font-family="monospace">0000</text>
<text x="396" y="270" font-size="34" fill="#233647" text-anchor="start" font-weight="700">.</text>
<text x="396" y="362" font-size="34" fill="#2166ac" text-anchor="start" font-weight="700">.</text>
<rect x="418" y="228" width="118" height="58" rx="6" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="477" y="269" font-size="28" fill="#233647" text-anchor="middle" font-weight="700" font-family="monospace">1010</text>
<line x1="309" y1="294" x2="309" y2="326" stroke="#2166ac" stroke-width="2.2"/>
<path d="M 313.9 317.0 L 309 326 L 304.1 317.0" fill="none" stroke="#2166ac" stroke-width="2.2" stroke-linejoin="round"/>
<text x="309" y="362" font-size="30" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<line x1="477" y1="294" x2="477" y2="326" stroke="#2166ac" stroke-width="2.2"/>
<path d="M 481.9 317.0 L 477 326 L 472.1 317.0" fill="none" stroke="#2166ac" stroke-width="2.2" stroke-linejoin="round"/>
<text x="477" y="362" font-size="30" fill="#2166ac" text-anchor="middle" font-weight="700">A</text>
<text x="566" y="270" font-size="17" fill="#5a6b7b" text-anchor="start">← 右に0を補う</text>
<text x="566" y="362" font-size="20" fill="#233647" text-anchor="start" font-weight="700">= 0.A₍₁₆₎</text>
</svg>
