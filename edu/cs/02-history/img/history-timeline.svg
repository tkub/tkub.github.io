<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">コンピューター発展史の年表</title><desc id="desc">1822年のバベッジの階差機関の構想から、1941年Z3、1943〜44年Colossus、1946年ENIAC公開、1947年トランジスタ発明、1951年EDVAC稼働、1956年FUJIC完成、1958〜59年IC発明、1964年IBM System/360、1971年Intel 4004、1979年PC-8001、2020年代のマルチコア・GPU・AI用チップまで。下の帯はハードウェアの世代の目安。</desc><rect width="100%" height="100%" fill="white"/>
