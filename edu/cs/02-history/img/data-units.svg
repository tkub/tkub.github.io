<text x="164" y="160" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">×8</text>
<rect x="190" y="140" width="110" height="64" rx="8" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="245" y="170" font-size="24" fill="#233647" text-anchor="middle" font-weight="700">1 B</text>
<text x="245" y="194" font-size="15" fill="#5a6b7b" text-anchor="middle">バイト</text>
<path d="M 300 160 C 320 160 316 116 334 116" fill="none" stroke="#2166ac" stroke-width="2.2"/>
<path d="M 300 184 C 320 184 316 256 334 256" fill="none" stroke="#d7301f" stroke-width="2.2"/>
<text x="340" y="68" font-size="17" fill="#2166ac" text-anchor="start" font-weight="700">10進接頭辞(SI): 記憶装置の容量、通信速度など</text>
<text x="340" y="208" font-size="17" fill="#d7301f" text-anchor="start" font-weight="700">2進接頭辞(IEC): メモリの容量など</text>
