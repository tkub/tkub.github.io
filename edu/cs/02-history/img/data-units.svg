<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">データ量の単位の関係</title><desc id="desc">1バイトは8ビット。10進接頭辞ではB, kB, MB, GB, TBと1000倍ずつ、2進接頭辞ではB, KiB, MiB, GiB, TiBと1024倍ずつ大きくなる。目安として英字1文字は1B、写真1枚は数MB、動画1時間は数GB、HDD1台は数TB。</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="38" font-size="23" fill="#233647" text-anchor="start" font-weight="700">データ量の単位: ビット → バイト → キロ → メガ → ギガ → テラ</text>
<rect x="28" y="140" width="110" height="64" rx="8" fill="#e3edf6" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="83" y="170" font-size="24" fill="#233647" text-anchor="middle" font-weight="700">1 b</text>
<text x="83" y="194" font-size="15" fill="#5a6b7b" text-anchor="middle">ビット</text>
<line x1="144" y1="172" x2="184" y2="172" stroke="#233647" stroke-width="2.2"/>
