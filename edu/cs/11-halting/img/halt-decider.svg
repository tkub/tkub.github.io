<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">停止判定プログラムHaltの入出力</title><desc id="desc">プログラムPと、Pへの入力xの2つを受け取り、Pがxでいつか止まるなら「停止する」、永久に止まらないなら「停止しない」と答えて止まる。そのようなプログラムが作れるかが問題。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#235e85"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5a6b7b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d7301f"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" text-anchor="start" font-weight="700">停止判定プログラム Halt（もし作れるとしたら）</text>
<rect x="40" y="80" width="230" height="84" rx="10" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="155" y="114" font-size="22" fill="#233647" text-anchor="middle" font-weight="700">プログラム P</text>
<text x="155" y="144" font-size="17" fill="#5a6b7b" text-anchor="middle">例：整列のプログラム</text>
<rect x="40" y="196" width="230" height="84" rx="10" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="155" y="230" font-size="22" fill="#233647" text-anchor="middle" font-weight="700">P への入力 x</text>
<text x="155" y="260" font-size="17" fill="#5a6b7b" text-anchor="middle">例：数の並び 9, 1, 4</text>
<line x1="272" y1="122" x2="372" y2="170" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<line x1="272" y1="238" x2="372" y2="190" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<rect x="378" y="120" width="220" height="120" rx="12" fill="#ffffff" stroke="#233647" stroke-width="2.5"/>
<text x="488" y="176" font-size="30" fill="#233647" text-anchor="middle" font-weight="700">Halt</text>
<text x="488" y="208" font-size="17" fill="#5a6b7b" text-anchor="middle">P を x で動かしたら</text>
<text x="488" y="228" font-size="17" fill="#5a6b7b" text-anchor="middle">止まるか？を判定</text>
<line x1="600" y1="160" x2="680" y2="118" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<line x1="600" y1="200" x2="680" y2="242" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<rect x="686" y="86" width="250" height="64" rx="10" fill="#eaf2fa" stroke="#2166ac" stroke-width="2"/>
<text x="811" y="115" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">「停止する」</text>
<text x="811" y="139" font-size="17" fill="#235e85" text-anchor="middle">P はいつか止まる</text>
<rect x="686" y="210" width="250" height="64" rx="10" fill="#fdeeec" stroke="#d7301f" stroke-width="2"/>
<text x="811" y="239" font-size="20" fill="#d7301f" text-anchor="middle" font-weight="700">「停止しない」</text>
<text x="811" y="263" font-size="17" fill="#d7301f" text-anchor="middle">P は永久に動き続ける</text>
<text x="28" y="314" font-size="17" fill="#5a6b7b" text-anchor="start">Halt 自身は、どんな P と x に対しても必ず有限時間で答えを出して止まらなければならない。</text>
</svg>
