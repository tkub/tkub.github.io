<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">チューリングマシンのしくみ</title><desc id="desc">左右に無限に続くテープに0と1が書かれ、ヘッドが1マスを指す。機械はいまの状態(AやB)を覚えている。1ステップでは、ヘッドの下の記号と状態から規則表の1行を選び、記号を書き換え、左右に1マス動き、次の状態に移る。規則表は2状態の例で、Aで0を読んだら1を書いて右へ動きBへ、Aで1なら1を書いて左へBへ、Bで0なら1を書いて左へAへ、Bで1なら1を書いて右へ動き停止。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#235e85"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5a6b7b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d7301f"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" text-anchor="start" font-weight="700">チューリングマシン：テープ・ヘッド・状態・規則表</text>
