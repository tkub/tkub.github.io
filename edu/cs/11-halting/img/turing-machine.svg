<text x="360.0" y="88" font-size="17" fill="#235e85" text-anchor="middle">いまの状態</text>
<text x="360.0" y="110" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">A</text>
<path d="M 346.0 124 L 374.0 124 L 360.0 150 Z" fill="#2166ac" stroke="#2166ac" stroke-width="1"/>
<text x="444.0" y="145" font-size="17" fill="#235e85" text-anchor="start">ヘッド（1マスだけ読み書きする）</text>
<rect x="72" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="104.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="136" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="168.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="200" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="232.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="264" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="296.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="328" y="160" width="64" height="60" rx="0" fill="#eaf2fa" stroke="#233647" stroke-width="2.5"/>
<text x="360.0" y="199" font-size="24" fill="#233647" text-anchor="middle">1</text>
<rect x="392" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="424.0" y="199" font-size="24" fill="#233647" text-anchor="middle">1</text>
<rect x="456" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="488.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="520" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="552.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="584" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="616.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="648" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="680.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="712" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="744.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<rect x="776" y="160" width="64" height="60" rx="0" fill="#ffffff" stroke="#5a6b7b" stroke-width="1.5"/>
<text x="808.0" y="199" font-size="24" fill="#233647" text-anchor="middle">0</text>
<text x="38" y="198" font-size="24" fill="#5a6b7b" text-anchor="middle">…</text>
<text x="874" y="198" font-size="24" fill="#5a6b7b" text-anchor="middle">…</text>
<text x="72" y="252" font-size="17" fill="#5a6b7b" text-anchor="start">テープ：左右にいくらでも続く。最初は、入力以外のマスはすべて0</text>
<text x="40" y="288" font-size="18" fill="#233647" text-anchor="start" font-weight="700">規則表（2状態の例）</text>
<rect x="40" y="300" width="580" height="38" rx="0" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="85.0" y="325" font-size="17" fill="#235e85" text-anchor="middle" font-weight="700">状態</text>
<text x="195.0" y="325" font-size="17" fill="#235e85" text-anchor="middle" font-weight="700">読んだ記号</text>
<text x="320.0" y="325" font-size="17" fill="#235e85" text-anchor="middle" font-weight="700">書く記号</text>
<text x="440.0" y="325" font-size="17" fill="#235e85" text-anchor="middle" font-weight="700">動く向き</text>
<text x="560.0" y="325" font-size="17" fill="#235e85" text-anchor="middle" font-weight="700">次の状態</text>
<rect x="40" y="338" width="580" height="38" rx="0" fill="#ffffff" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="85.0" y="364" font-size="18" fill="#233647" text-anchor="middle">A</text>
<text x="195.0" y="364" font-size="18" fill="#233647" text-anchor="middle">0</text>
<text x="320.0" y="364" font-size="18" fill="#233647" text-anchor="middle">1</text>
<text x="440.0" y="364" font-size="18" fill="#233647" text-anchor="middle">右</text>
<text x="560.0" y="364" font-size="18" fill="#233647" text-anchor="middle">B</text>
<rect x="40" y="376" width="580" height="38" rx="0" fill="#ffffff" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="85.0" y="402" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">A</text>
<text x="195.0" y="402" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">1</text>
<text x="320.0" y="402" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">1</text>
<text x="440.0" y="402" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">左</text>
<text x="560.0" y="402" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">B</text>
<rect x="40" y="414" width="580" height="38" rx="0" fill="#ffffff" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="85.0" y="440" font-size="18" fill="#233647" text-anchor="middle">B</text>
<text x="195.0" y="440" font-size="18" fill="#233647" text-anchor="middle">0</text>
<text x="320.0" y="440" font-size="18" fill="#233647" text-anchor="middle">1</text>
<text x="440.0" y="440" font-size="18" fill="#233647" text-anchor="middle">左</text>
<text x="560.0" y="440" font-size="18" fill="#233647" text-anchor="middle">A</text>
<rect x="40" y="452" width="580" height="38" rx="0" fill="#ffffff" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="85.0" y="478" font-size="18" fill="#233647" text-anchor="middle">B</text>
<text x="195.0" y="478" font-size="18" fill="#233647" text-anchor="middle">1</text>
<text x="320.0" y="478" font-size="18" fill="#233647" text-anchor="middle">1</text>
<text x="440.0" y="478" font-size="18" fill="#233647" text-anchor="middle">右</text>
<text x="560.0" y="478" font-size="18" fill="#d7301f" text-anchor="middle">停止</text>
<rect x="36" y="373" width="588" height="44" rx="4" fill="none" stroke="#2166ac" stroke-width="2.5"/>
<text x="640" y="318" font-size="18" fill="#233647" text-anchor="start" font-weight="700">1ステップでやること</text>
<text x="640" y="352" font-size="17" fill="#233647" text-anchor="start">① ヘッドの下の記号を読む</text>
<text x="640" y="382" font-size="17" fill="#233647" text-anchor="start">② 状態と記号から規則表の行を選ぶ</text>
<text x="640" y="412" font-size="17" fill="#233647" text-anchor="start">③ 記号を書き、左右に1マス動き、</text>
<text x="640" y="442" font-size="17" fill="#233647" text-anchor="start">　 次の状態に移る</text>
<text x="640" y="486" font-size="17" fill="#235e85" text-anchor="start">図では状態Aで1を読んでいるので、</text>
<text x="640" y="512" font-size="17" fill="#235e85" text-anchor="start">枠で囲んだ「A・1」の行を使う：</text>
<text x="640" y="538" font-size="17" fill="#235e85" text-anchor="start">1を書き、左へ動き、状態Bへ</text>
</svg>
