<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">停止判定Haltを部品にした天邪鬼プログラムPHの構成</title><desc id="desc">PHは入力されたプログラムPを複製し、プログラムとしてのPと入力データとしてのPの両方をHaltに渡して、Halt(P,P)を計算する。答えが「停止する」ならわざと無限ループに入り、「停止しない」ならただちに停止する。つまりHaltの答えと逆の振る舞いをする。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#235e85"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5a6b7b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d7301f"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" text-anchor="start" font-weight="700">天邪鬼プログラム P<tspan font-size="16" dy="6.0">H</tspan><tspan dy="-6.0">：Haltの答えの逆をする</tspan></text>
<rect x="180" y="64" width="760" height="330" rx="14" fill="#f7f9fb" stroke="#2166ac" stroke-width="2.2"/>
<text x="200" y="94" font-size="19" fill="#2166ac" font-weight="700">プログラム P<tspan font-size="13" dy="4.8">H</tspan><tspan dy="-4.8">の中身</tspan></text>
<rect x="20" y="196" width="140" height="70" rx="10" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="90" y="224" font-size="17" fill="#5a6b7b" text-anchor="middle">入力</text>
<text x="90" y="252" font-size="18" fill="#233647" text-anchor="middle" font-weight="700">プログラム P</text>
<line x1="160" y1="231" x2="214" y2="231" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 218 231 C 236 231 236 150 256 150" fill="none" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 218 231 C 236 231 236 312 256 312" fill="none" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="214" y="268" font-size="17" fill="#235e85" text-anchor="middle">複製</text>
<rect x="262" y="118" width="206" height="64" rx="10" fill="#ffffff" stroke="#233647" stroke-width="1.5"/>
<text x="365" y="144" font-size="17" fill="#5a6b7b" text-anchor="middle">調べるプログラム</text>
<text x="365" y="170" font-size="20" fill="#233647" text-anchor="middle" font-weight="700">P</text>
<rect x="262" y="280" width="206" height="64" rx="10" fill="#ffffff" stroke="#233647" stroke-width="1.5"/>
<text x="365" y="306" font-size="17" fill="#5a6b7b" text-anchor="middle">それへの入力データ</text>
<text x="365" y="332" font-size="20" fill="#233647" text-anchor="middle" font-weight="700">P（Pの文字列）</text>
<line x1="468" y1="150" x2="508" y2="206" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<line x1="468" y1="312" x2="508" y2="256" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<rect x="512" y="190" width="150" height="82" rx="10" fill="#ffffff" stroke="#233647" stroke-width="2.5"/>
<text x="587" y="226" font-size="20" fill="#233647" text-anchor="middle" font-weight="700">Halt(P, P)</text>
<text x="587" y="254" font-size="17" fill="#5a6b7b" text-anchor="middle">を計算</text>
<line x1="662" y1="212" x2="716" y2="150" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<line x1="662" y1="250" x2="716" y2="312" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="636" y="150" font-size="17" fill="#5a6b7b" text-anchor="middle">答えが</text>
<text x="636" y="172" font-size="17" fill="#2166ac" text-anchor="middle" font-weight="700">「停止する」</text>
<text x="636" y="302" font-size="17" fill="#5a6b7b" text-anchor="middle">答えが</text>
<text x="636" y="324" font-size="17" fill="#d7301f" text-anchor="middle" font-weight="700">「停止しない」</text>
<rect x="720" y="110" width="200" height="76" rx="10" fill="#fdeeec" stroke="#d7301f" stroke-width="2"/>
<text x="820" y="142" font-size="18" fill="#d7301f" text-anchor="middle" font-weight="700">わざと無限ループ</text>
<text x="820" y="168" font-size="17" fill="#d7301f" text-anchor="middle">（停止しない）</text>
<rect x="720" y="276" width="200" height="76" rx="10" fill="#eaf2fa" stroke="#2166ac" stroke-width="2"/>
<text x="820" y="308" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">ただちに停止する</text>
<text x="820" y="334" font-size="17" fill="#2166ac" text-anchor="middle">（停止する）</text>
<rect x="20" y="412" width="920" height="44" rx="8" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="480" y="441" font-size="17" fill="#233647" text-anchor="middle">このあと、P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2">の入力に</tspan> P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2"> 自身を与えて矛盾を導く（次の図）</tspan></text>
</svg>
