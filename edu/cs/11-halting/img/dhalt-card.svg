<svg xml:lang="ja" lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#333"/></marker>
</defs>
<rect x="3" y="3" width="994" height="506" rx="14" fill="#fcfdfe" stroke="#d5dde4" stroke-width="1.5"/>
<rect x="22" y="18" width="64" height="28" rx="14" fill="#2166ac"/>
<text x="54" y="37" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">構成</text>
<text x="100" y="38" font-size="17" fill="#333" text-anchor="start" font-weight="bold">停止判定プログラムHaltから作る「天邪鬼」プログラム</text>

<!-- P_H の大きな箱 -->
<rect x="170" y="64" width="680" height="340" rx="14" fill="#f5f9fd" stroke="#2166ac" stroke-width="2.2"/>
<text x="186" y="92" font-size="15" fill="#2166ac" font-weight="bold">天邪鬼プログラム P<tspan dy="3.3" font-size="11">H</tspan></text>

<!-- 入力 -->
<rect x="30" y="204" width="112" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
<text x="86" y="228" font-size="12" fill="#666" text-anchor="middle">入力:</text>
<text x="86" y="247" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">プログラムP</text>
<line x1="142" y1="232" x2="196" y2="232" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

<!-- 分岐: P を2つにコピー -->
<path d="M 200 232 C 220 232 220 152 238 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 200 232 C 220 232 220 312 238 314" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

<!-- コピーされた2つのP -->
<rect x="244" y="122" width="172" height="58" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
<text x="330" y="146" font-size="12" fill="#666" text-anchor="middle">Haltに渡す「プログラム」</text>
<text x="330" y="166" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">P</text>
<rect x="244" y="286" width="172" height="58" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
<text x="330" y="310" font-size="12" fill="#666" text-anchor="middle">Haltに渡す「入力データ」</text>
<text x="330" y="330" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">P (プログラムPの文字列)</text>
<text x="330" y="374" font-size="11.5" fill="#666" text-anchor="middle">入力されたPを複製して、</text>
<text x="330" y="390" font-size="11.5" fill="#666" text-anchor="middle">2つの引数の両方として渡す</text>

<!-- Halt 箱 -->
<rect x="470" y="198" width="140" height="68" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="540" y="227" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">Halt(P, P)</text>
<text x="540" y="248" font-size="10.5" fill="#666" text-anchor="middle">停止するかを判定</text>
<line x1="416" y1="151" x2="466" y2="210" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="416" y1="315" x2="466" y2="254" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

<!-- 出力分岐 -->
<line x1="610" y1="216" x2="658" y2="160" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="626" y="162" font-size="12.5" fill="#d7301f" text-anchor="middle" font-weight="bold">「停止する」</text>
<line x1="610" y1="248" x2="658" y2="306" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="628" y="300" font-size="12.5" fill="#2166ac" text-anchor="middle" font-weight="bold">「停止しない」</text>

<rect x="662" y="106" width="175" height="58" rx="10" fill="#fdeeec" stroke="#d7301f" stroke-width="2"/>
<text x="749.5" y="130" font-size="13.5" fill="#d7301f" text-anchor="middle" font-weight="bold">わざと無限ループに入る</text>
<text x="749.5" y="151" font-size="12" fill="#d7301f" text-anchor="middle">(= 停止しない)</text>
<rect x="662" y="300" width="175" height="52" rx="10" fill="#eaf2fa" stroke="#2166ac" stroke-width="2"/>
<text x="749.5" y="331" font-size="13.5" fill="#2166ac" text-anchor="middle" font-weight="bold">ただちに停止する</text>

<!-- 右注釈 -->
<text x="864" y="216" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Haltの答えと</text>
<text x="864" y="236" font-size="13" fill="#333" text-anchor="start" font-weight="bold">常に逆の振る舞い</text>

<!-- 下部の問いかけ -->
<rect x="22" y="436" width="956" height="42" rx="8" fill="#f2f5f8"/>
<text x="500" y="463" font-size="14.5" fill="#333" text-anchor="middle">では、この P<tspan dy="3" font-size="11">H</tspan><tspan dy="-3"> に P</tspan><tspan dy="3" font-size="11">H</tspan><tspan dy="-3"> 自身を入力として与えたらどうなるか？ — どちらの分岐でも矛盾が起きます(本文参照)</tspan></text>
</svg>
