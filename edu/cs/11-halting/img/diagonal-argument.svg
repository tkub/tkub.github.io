<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">停止性の表と対角線論法</title><desc id="desc">行がプログラムP1,P2,P3,P4、列が入力P1,P2,P3,P4の表に、停止するなら停、停止しないなら不停を書く。対角線のセルは停、不停、停、不停。PHの行は対角線の値をすべて反転した不停、停、不停、停になる。PHがk番目のプログラムPkと同じだとすると、k列目で必ず食い違う。例えばP3とは3列目で、停と不停が食い違う。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#235e85"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5a6b7b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d7301f"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" font-weight="700">表 Halt(P<tspan font-size="17" dy="6">i</tspan><tspan dy="-6">, P</tspan><tspan font-size="17" dy="6">j</tspan><tspan dy="-6">) の対角線を反転すると、どの行とも違う行ができる</tspan></text>
<text x="115.0" y="94" font-size="17" fill="#5a6b7b" text-anchor="middle">行：プログラム</text>
<text x="115.0" y="114" font-size="17" fill="#5a6b7b" text-anchor="middle">列：入力</text>
<text x="250.0" y="108" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">1</tspan></text>
<text x="370.0" y="108" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">2</tspan></text>
<text x="490.0" y="108" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">3</tspan></text>
<text x="610.0" y="108" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">4</tspan></text>
<text x="700" y="108" font-size="21" fill="#5a6b7b" text-anchor="middle">…</text>
<line x1="40" y1="126" x2="730" y2="126" stroke="#233647" stroke-width="1.5"/>
<line x1="190" y1="70" x2="190" y2="360" stroke="#233647" stroke-width="1.5"/>
<text x="115.0" y="162" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">1</tspan></text>
<rect x="196" y="132" width="108" height="44" rx="6" fill="#fdeeec" stroke="#d7301f" stroke-width="2.5"/>
<text x="250.0" y="162" font-size="20" fill="#d7301f" text-anchor="middle" font-weight="700">停</text>
<text x="370.0" y="162" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="490.0" y="162" font-size="20" fill="#233647" text-anchor="middle">不停</text>
<text x="610.0" y="162" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="700" y="162" font-size="20" fill="#5a6b7b" text-anchor="middle">…</text>
<line x1="40" y1="182" x2="730" y2="182" stroke="#dde5ec" stroke-width="1"/>
<text x="115.0" y="218" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">2</tspan></text>
<text x="250.0" y="218" font-size="20" fill="#233647" text-anchor="middle">不停</text>
<rect x="316" y="188" width="108" height="44" rx="6" fill="#fdeeec" stroke="#d7301f" stroke-width="2.5"/>
<text x="370.0" y="218" font-size="20" fill="#d7301f" text-anchor="middle" font-weight="700">不停</text>
<text x="490.0" y="218" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="610.0" y="218" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="700" y="218" font-size="20" fill="#5a6b7b" text-anchor="middle">…</text>
<line x1="40" y1="238" x2="730" y2="238" stroke="#dde5ec" stroke-width="1"/>
<text x="115.0" y="274" font-size="21" fill="#d7301f" text-anchor="middle" font-weight="700">P<tspan font-size="14" dy="5.2">3</tspan></text>
<text x="250.0" y="274" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="370.0" y="274" font-size="20" fill="#233647" text-anchor="middle">停</text>
<rect x="436" y="244" width="108" height="44" rx="6" fill="#fdeeec" stroke="#d7301f" stroke-width="2.5"/>
<text x="490.0" y="274" font-size="20" fill="#d7301f" text-anchor="middle" font-weight="700">停</text>
<text x="610.0" y="274" font-size="20" fill="#233647" text-anchor="middle">不停</text>
<text x="700" y="274" font-size="20" fill="#5a6b7b" text-anchor="middle">…</text>
<line x1="40" y1="294" x2="730" y2="294" stroke="#dde5ec" stroke-width="1"/>
<text x="115.0" y="330" font-size="21" fill="#233647" text-anchor="middle">P<tspan font-size="14" dy="5.2">4</tspan></text>
<text x="250.0" y="330" font-size="20" fill="#233647" text-anchor="middle">不停</text>
<text x="370.0" y="330" font-size="20" fill="#233647" text-anchor="middle">停</text>
<text x="490.0" y="330" font-size="20" fill="#233647" text-anchor="middle">不停</text>
<rect x="556" y="300" width="108" height="44" rx="6" fill="#fdeeec" stroke="#d7301f" stroke-width="2.5"/>
<text x="610.0" y="330" font-size="20" fill="#d7301f" text-anchor="middle" font-weight="700">不停</text>
<text x="700" y="330" font-size="20" fill="#5a6b7b" text-anchor="middle">…</text>
<line x1="40" y1="350" x2="730" y2="350" stroke="#dde5ec" stroke-width="1"/>
<text x="115.0" y="380" font-size="22" fill="#5a6b7b" text-anchor="middle">⋮</text>
<text x="700" y="380" font-size="22" fill="#5a6b7b" text-anchor="middle">⋱</text>
<text x="750" y="156" font-size="17" fill="#d7301f" text-anchor="start" font-weight="700">赤い枠＝対角線</text>
<text x="750" y="182" font-size="17" fill="#d7301f" text-anchor="start">自分自身を入力した</text>
<text x="750" y="206" font-size="17" fill="#d7301f" text-anchor="start">ときの停止性</text>
<line x1="250.0" y1="394" x2="250.0" y2="450" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="258.0" y="428.0" font-size="17" fill="#235e85" text-anchor="start">反転</text>
<line x1="370.0" y1="394" x2="370.0" y2="450" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="378.0" y="428.0" font-size="17" fill="#235e85" text-anchor="start">反転</text>
<line x1="490.0" y1="394" x2="490.0" y2="450" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="498.0" y="428.0" font-size="17" fill="#235e85" text-anchor="start">反転</text>
<line x1="610.0" y1="394" x2="610.0" y2="450" stroke="#235e85" stroke-width="2" marker-end="url(#ah)"/>
<text x="618.0" y="428.0" font-size="17" fill="#235e85" text-anchor="start">反転</text>
<text x="115.0" y="418.0" font-size="17" fill="#235e85" text-anchor="middle">対角線の値を</text>
<text x="115.0" y="438.0" font-size="17" fill="#235e85" text-anchor="middle">1つずつ反転</text>
<rect x="40" y="456" width="690" height="56" rx="8" fill="#eaf2fa" stroke="#2166ac" stroke-width="2.5"/>
<text x="115.0" y="492" font-size="21" fill="#2166ac" text-anchor="middle" font-weight="700">P<tspan font-size="14" dy="5.2">H</tspan></text>
<text x="250.0" y="492" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">不停</text>
<text x="370.0" y="492" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">停</text>
<text x="490.0" y="492" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">不停</text>
<text x="610.0" y="492" font-size="20" fill="#2166ac" text-anchor="middle" font-weight="700">停</text>
<text x="700" y="492" font-size="20" fill="#2166ac" text-anchor="middle">…</text>
<text x="750" y="480" font-size="17" fill="#2166ac">P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2"> の行</tspan></text>
<text x="750" y="504" font-size="17" fill="#2166ac" text-anchor="start">（天邪鬼の動作）</text>
<text x="40" y="552" font-size="17" fill="#233647">例：P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2"> を </tspan>P<tspan font-size="12" dy="4">3</tspan><tspan dy="-4"> の行と比べると、3列目が「停」と「不停」で食い違う。</tspan></text>
<text x="40" y="582" font-size="17" fill="#233647">どの k でも、P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2"> と </tspan>P<tspan font-size="12" dy="4">k</tspan><tspan dy="-4"> は k 列目で必ず食い違う → P<tspan font-size="11" dy="4.2">H</tspan><tspan dy="-4.2"> はどの行にもなれない。</tspan></tspan></text>
</svg>
