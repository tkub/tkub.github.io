<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="t">セリフ体・サンセリフ体と明朝体・ゴシック体の違い(模式図)</title>
<desc id="d">欧文のHの字形で、線の端に飾り(セリフ)があるセリフ体と、飾りがなく太さがほぼ均一なサンセリフ体を比べる。和文の十の字形で、横画が細く縦画が太く横画の終わりにウロコがある明朝体と、太さがほぼ均一なゴシック体を比べる。実際の書体を使わず図形で描いた模式図。</desc>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="20" y="20" width="410" height="360" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="225" y="52" font-size="19" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">欧文書体</text>
<rect x="450" y="20" width="410" height="360" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="655" y="52" font-size="19" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">和文書体</text>
<rect x="82" y="100" width="18" height="150" fill="#233647"/>
<rect x="70" y="100" width="42" height="7" fill="#d7301f"/>
<rect x="70" y="243" width="42" height="7" fill="#d7301f"/>
<rect x="152" y="100" width="18" height="150" fill="#233647"/>
<rect x="140" y="100" width="42" height="7" fill="#d7301f"/>
<rect x="140" y="243" width="42" height="7" fill="#d7301f"/>
<rect x="100" y="168" width="52" height="7" fill="#233647"/>
<text x="130" y="290" font-size="17" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">セリフ体</text>
<text x="130" y="313" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">例: Century, Times New Roman</text>
<line x1="190" y1="90" x2="158" y2="102" stroke="#d7301f" stroke-width="1.8"/>
<circle cx="158" cy="102" r="3" fill="#d7301f"/>
<text x="196" y="84" font-size="15" fill="#d7301f" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">セリフ(線の端の飾り)</text>
<text x="130" y="345" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">太さに強弱がある</text>
<rect x="282" y="100" width="16" height="150" fill="#233647"/>
<rect x="352" y="100" width="16" height="150" fill="#233647"/>
<rect x="298" y="167" width="54" height="16" fill="#233647"/>
<text x="325" y="290" font-size="17" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">サンセリフ体</text>
<text x="325" y="313" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">例: Arial, Verdana</text>
<text x="325" y="345" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">飾りがなく太さがほぼ均一</text>
<rect x="490" y="186" width="128" height="8" fill="#233647"/>
<path d="M610,186 L620,174 L632,194 L610,194 Z" fill="#d7301f"/>
<rect x="551" y="120" width="18" height="140" fill="#233647"/>
<text x="560" y="290" font-size="17" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">明朝体</text>
<text x="560" y="313" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">例: 游明朝, MS 明朝</text>
<text x="560" y="345" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">縦画が太く、横画が細い</text>
<line x1="600" y1="96" x2="622" y2="176" stroke="#d7301f" stroke-width="1.8"/>
<circle cx="622" cy="176" r="3" fill="#d7301f"/>
<text x="470" y="86" font-size="15" fill="#d7301f" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">ウロコ(横画の終わりの山)</text>
<rect x="690" y="182" width="140" height="16" fill="#233647"/>
<rect x="752" y="120" width="16" height="140" fill="#233647"/>
<text x="760" y="290" font-size="17" fill="#233647" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">ゴシック体</text>
<text x="760" y="313" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">例: 游ゴシック, メイリオ</text>
<text x="760" y="345" font-size="14" fill="#5a6b7b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">飾りがなく太さがほぼ均一</text>
</svg>
