<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 236" width="596" height="236" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif" role="img">
<title>問題7の解答のタイミングチャート</title><desc>CLK、D、ラッチのQ(緑)、フリップフロップのQ(青)の波形。ラッチのQはCLKが1の間Dを追い、時刻1で1、2で0、6で1になる。フリップフロップのQは立ち上がりの時刻1で1、時刻5で0になる。</desc>
<rect width="596" height="236" fill="#ffffff"/>
<line x1="100" y1="26" x2="100" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="100" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">0</text>
<line x1="160" y1="26" x2="160" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="160" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">1</text>
<line x1="220" y1="26" x2="220" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="220" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">2</text>
<line x1="280" y1="26" x2="280" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="280" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">3</text>
<line x1="340" y1="26" x2="340" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="340" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">4</text>
<line x1="400" y1="26" x2="400" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="400" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">5</text>
<line x1="460" y1="26" x2="460" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="460" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">6</text>
<line x1="520" y1="26" x2="520" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="520" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">7</text>
<line x1="580" y1="26" x2="580" y2="202" stroke="#c4cfd6" stroke-width="1" stroke-dasharray="2,3"/>
<text x="580" y="21" fill="#5a6b7b" font-size="14" text-anchor="middle">8</text>
<line x1="160.0" y1="30" x2="160.0" y2="202" stroke="#d7301f" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.85"/>
<line x1="400.0" y1="30" x2="400.0" y2="202" stroke="#d7301f" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.85"/>
<text x="86" y="53" fill="#233647" font-size="17" text-anchor="end">CLK</text>
<path d="M100,58 L160.0,58 L160.0,34 L280.0,34 L280.0,58 L400.0,58 L400.0,34 L520.0,34 L520.0,58 L580.0,58" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="miter"/>
<text x="86" y="101" fill="#233647" font-size="17" text-anchor="end">D</text>
<path d="M100,82 L220.0,82 L220.0,106 L460.0,106 L460.0,82 L580.0,82" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="miter"/>
<rect x="100" y="125" width="480" height="34" fill="#fff6cc" opacity="0.7"/>
<text x="86" y="149" fill="#233647" font-size="17" text-anchor="end">ラッチ Q</text>
<path d="M100,154 L160.0,154 L160.0,130 L220.0,130 L220.0,154 L460.0,154 L460.0,130 L580.0,130" fill="none" stroke="#1b7837" stroke-width="2" stroke-linejoin="miter"/>
<rect x="100" y="173" width="480" height="34" fill="#fff6cc" opacity="0.7"/>
<text x="86" y="197" fill="#233647" font-size="17" text-anchor="end">FF Q</text>
<path d="M100,202 L160.0,202 L160.0,178 L400.0,178 L400.0,202 L580.0,202" fill="none" stroke="#2166ac" stroke-width="2" stroke-linejoin="miter"/>
<text x="100" y="228" fill="#d7301f" font-size="14">赤い点線: 立ち上がりエッジ(フリップフロップ(FF)が D を読む瞬間)</text>
</svg>