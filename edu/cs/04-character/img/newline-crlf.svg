<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">CRとLFの動き</title>
<desc id="desc">CR（0x0D）はカーソルを同じ行の先頭に戻し、LF（0x0A）はカーソルを1行下に送る。Windowsは改行をCRとLFの2バイトで、UnixやmacOSはLFの1バイトで表す。</desc>
<defs>
  <marker id="nl-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d7301f"/></marker>
  <marker id="nl-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2166ac"/></marker>
</defs>
<rect width="800" height="330" fill="#ffffff"/>
<!-- 画面(紙) -->
<rect x="24" y="24" width="400" height="200" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<g stroke="#dde5ec"><line x1="40" y1="92" x2="408" y2="92"/><line x1="40" y1="160" x2="408" y2="160"/></g>
<text x="52" y="80" font-size="28" fill="#233647" font-family="Menlo,Consolas,monospace">Hello</text>
<!-- カーソル位置 -->
<rect x="146" y="56" width="3" height="30" fill="#233647"/>
<text x="160" y="52" font-size="14" fill="#5a6b7b">行末のカーソル</text>
<!-- CR -->
<path d="M140,104 L62,104" fill="none" stroke="#d7301f" stroke-width="2.5" marker-end="url(#nl-red)"/>
<text x="150" y="110" font-size="16" fill="#d7301f" font-weight="700">① CR：同じ行の先頭へ戻す</text>
<!-- LF -->
<path d="M52,112 L52,140" fill="none" stroke="#2166ac" stroke-width="2.5" marker-end="url(#nl-blue)"/>
<text x="68" y="140" font-size="16" fill="#2166ac" font-weight="700">② LF：1行下へ送る</text>
<rect x="50" y="166" width="3" height="30" fill="#233647"/>
<text x="62" y="190" font-size="14" fill="#5a6b7b">次の行の先頭から書ける</text>
<!-- 右側: OSごとの表現 -->
<text x="452" y="52" font-size="17" fill="#233647" font-weight="700">改行を表すバイト</text>
<g font-size="15" fill="#233647">
  <text x="452" y="92">Windows</text>
  <rect x="616" y="72" width="56" height="30" rx="4" fill="#fbe3de" stroke="#d7301f"/>
  <text x="644" y="93" text-anchor="middle" font-family="Menlo,Consolas,monospace">0D</text>
  <rect x="678" y="72" width="56" height="30" rx="4" fill="#dbe8f5" stroke="#2166ac"/>
  <text x="706" y="93" text-anchor="middle" font-family="Menlo,Consolas,monospace">0A</text>
  <text x="742" y="93" fill="#5a6b7b">CR+LF</text>
  <text x="452" y="142">Unix・macOS</text>
  <rect x="678" y="122" width="56" height="30" rx="4" fill="#dbe8f5" stroke="#2166ac"/>
  <text x="706" y="143" text-anchor="middle" font-family="Menlo,Consolas,monospace">0A</text>
  <text x="742" y="143" fill="#5a6b7b">LF</text>
  <text x="452" y="192">古いMac（OS 9以前）</text>
  <rect x="616" y="172" width="56" height="30" rx="4" fill="#fbe3de" stroke="#d7301f"/>
  <text x="644" y="193" text-anchor="middle" font-family="Menlo,Consolas,monospace">0D</text>
  <text x="742" y="193" fill="#5a6b7b">CR</text>
</g>
<text x="24" y="270" font-size="16" fill="#233647">タイプライターでは、キャリッジ（紙を載せた台）を左端に戻す操作と、紙を1行送る操作が別でした。</text>
<text x="24" y="302" font-size="16" fill="#233647">その名残で、改行の表し方が「CR+LF」と「LFだけ」などに分かれています。</text>
</svg>
