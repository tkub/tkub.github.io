<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">JIS X 0208の区点と符号化</title>
<desc id="desc">JIS X 0208は94区×94点の表で、1〜8区に記号・英数字・かな・ギリシャ・キリル文字・罫線、16〜47区に第一水準漢字、48〜84区に第二水準漢字がある。あは4区2点で、ISO-2022-JPでは24 22、EUC-JPではA4 A2、Shift_JISでは82 A0になる。</desc>
<rect width="800" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="19" fill="#233647" font-weight="700">JIS X 0208 の区点(94×94)と、「あ」(4区2点)の符号化</text>
<rect x="150" y="70.0" width="230" height="7.0" fill="#dde5ec" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="77.0" width="230" height="3.5" fill="#dde5ec" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="80.5" width="230" height="3.5" fill="#dbe8f5" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="84.0" width="230" height="3.5" fill="#dde5ec" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="87.5" width="230" height="10.5" fill="#dde5ec" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="98.0" width="230" height="24.5" fill="#ffffff" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="122.5" width="230" height="112.0" fill="#fbe3de" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="234.5" width="230" height="129.5" fill="#fde9d9" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="364.0" width="230" height="35.0" fill="#ffffff" stroke="#c4cfd6" stroke-width="0.8"/>
<rect x="150" y="70" width="230" height="329.0" fill="none" stroke="#5a6b7b" stroke-width="1.2"/>
<text x="265.0" y="60" font-size="14" fill="#5a6b7b" text-anchor="middle">点(1〜94) →</text>
<text x="142" y="76" font-size="14" fill="#5a6b7b" text-anchor="end">1区</text>
<text x="140" y="399.0" font-size="14" fill="#5a6b7b" text-anchor="end">94区</text>
<text x="140" y="234.5" font-size="14" fill="#5a6b7b" text-anchor="end">区↓</text>
<text x="265.0" y="115.2" font-size="14" fill="#233647" text-anchor="middle">(空き)</text>
<text x="265.0" y="183.5" font-size="14" fill="#233647" text-anchor="middle">第一水準漢字 2,965字(読みの順)</text>
<text x="265.0" y="304.2" font-size="14" fill="#233647" text-anchor="middle">第二水準漢字 3,390字(部首順)</text>
<text x="265.0" y="386.5" font-size="14" fill="#233647" text-anchor="middle">(空き)</text>
<path d="M380,73.5 L394,73.5 L404,71" fill="none" stroke="#8a99a6" stroke-width="0.8"/>
<text x="408" y="76" font-size="14" fill="#233647">1〜2区：記号</text>
<path d="M380,78.8 L394,78.8 L404,90" fill="none" stroke="#8a99a6" stroke-width="0.8"/>
<text x="408" y="95" font-size="14" fill="#233647">3区：英数字</text>
<path d="M380,82.2 L394,82.2 L404,109" fill="none" stroke="#8a99a6" stroke-width="0.8"/>
<text x="408" y="114" font-size="14" fill="#233647">4区：ひらがな</text>
<path d="M380,85.8 L394,85.8 L404,128" fill="none" stroke="#8a99a6" stroke-width="0.8"/>
<text x="408" y="133" font-size="14" fill="#233647">5区：カタカナ</text>
<path d="M380,92.8 L394,92.8 L404,147" fill="none" stroke="#8a99a6" stroke-width="0.8"/>
<text x="408" y="152" font-size="14" fill="#233647">6〜8区：ギリシャ・キリル文字、罫線</text>
<circle cx="153.7" cy="82.2" r="5" fill="#d7301f"/>
<path d="M148.7,82.2 L110,110" stroke="#d7301f" stroke-width="1.2"/>
<text x="140" y="128" font-size="15" fill="#d7301f" font-weight="700" text-anchor="end">あ＝4区2点</text>
<text x="430" y="196" font-size="16" fill="#1c3d5f" font-weight="700">区と点の番号をバイトに変換する</text>
<rect x="430" y="214" width="346" height="72" rx="8" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="444" y="240" font-size="16" fill="#2166ac" font-weight="700">ISO-2022-JP</text>
<text x="562" y="240" font-size="14.5" fill="#233647">区＋0x20、点＋0x20</text>
<text x="444" y="270" font-size="19" fill="#d7301f" font-weight="700" font-family="Menlo,Consolas,monospace">24 22</text>
<text x="530" y="269" font-size="14" fill="#5a6b7b">ASCIIの図形文字と同じ範囲</text>
<rect x="430" y="298" width="346" height="72" rx="8" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="444" y="324" font-size="16" fill="#2166ac" font-weight="700">EUC-JP</text>
<text x="562" y="324" font-size="14.5" fill="#233647">区＋0xA0、点＋0xA0</text>
<text x="444" y="354" font-size="19" fill="#d7301f" font-weight="700" font-family="Menlo,Consolas,monospace">A4 A2</text>
<text x="530" y="353" font-size="14" fill="#5a6b7b">どちらのバイトも0x80以上</text>
<rect x="430" y="382" width="346" height="72" rx="8" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="444" y="408" font-size="16" fill="#2166ac" font-weight="700">Shift_JIS</text>
<text x="562" y="408" font-size="14.5" fill="#233647">区が奇数か偶数かで式が変わる</text>
<text x="444" y="438" font-size="19" fill="#d7301f" font-weight="700" font-family="Menlo,Consolas,monospace">82 A0</text>
<text x="530" y="437" font-size="14" fill="#5a6b7b">2バイト目が0x5Cのことも</text>
<text x="24" y="484" font-size="14.5" fill="#233647">同じ「4区2点」でも、符号化方式によってバイト列が違う。ISO-2022-JPでは切替コードも必要。</text>
</svg>
