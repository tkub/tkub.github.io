<svg xml:lang="ja" lang="ja" viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <!-- 目盛り(バイト値) -->
  <g font-size="11" fill="#555555" font-family="Menlo,Consolas,monospace" text-anchor="middle">
    <line x1="60" y1="30" x2="725.6" y2="30" stroke="#333333"/>
    <g stroke="#333333">
      <line x1="60" y1="26" x2="60" y2="34"/>
      <line x1="143.2" y1="26" x2="143.2" y2="34"/>
      <line x1="226.4" y1="26" x2="226.4" y2="34"/>
      <line x1="309.6" y1="26" x2="309.6" y2="34"/>
      <line x1="392.8" y1="26" x2="392.8" y2="34"/>
      <line x1="476" y1="26" x2="476" y2="34"/>
      <line x1="559.2" y1="26" x2="559.2" y2="34"/>
      <line x1="642.4" y1="26" x2="642.4" y2="34"/>
      <line x1="725.6" y1="26" x2="725.6" y2="34"/>
    </g>
    <text x="60" y="18">00</text>
    <text x="143.2" y="18">20</text>
    <text x="226.4" y="18">40</text>
    <text x="309.6" y="18">60</text>
    <text x="392.8" y="18">80</text>
    <text x="476" y="18">A0</text>
    <text x="559.2" y="18">C0</text>
    <text x="642.4" y="18">E0</text>
    <text x="725.6" y="18">FF</text>
    <!-- 0x80の位置を示す破線 -->
    <line x1="392.8" y1="34" x2="392.8" y2="340" stroke="#999999" stroke-dasharray="4,3"/>
    <text x="392.8" y="352" fill="#999">0x80</text>
  </g>

  <!-- Row1: ASCII -->
  <text x="60" y="66" font-size="13" fill="#333">ASCII (すべてのバイトが0x80未満)</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <rect x="60" y="72" width="83.2" height="30" fill="#d6d6d6" stroke="#999999"/>
    <rect x="143.2" y="72" width="247" height="30" fill="#e8e8e8" stroke="#999999"/>
    <rect x="390.2" y="72" width="2.6" height="30" fill="#d6d6d6" stroke="#999999"/>
    <text x="101.6" y="91">制御文字</text>
    <text x="266.7" y="91">図形文字 (0x20〜0x7E)</text>
  </g>

  <!-- Row2: Shift_JIS 1バイト目 -->
  <text x="60" y="136" font-size="13" fill="#333">Shift_JIS: 1バイト目</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <rect x="60" y="142" width="332.8" height="30" fill="#e8e8e8" stroke="#999999"/>
    <text x="226.4" y="161">ASCII (1バイト文字)</text>
    <rect x="395.4" y="142" width="80.6" height="30" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="435.7" y="161">81〜9F</text>
    <rect x="478.6" y="142" width="163.8" height="30" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="560.5" y="161">半角カナ A1〜DF (1バイト)</text>
    <rect x="642.4" y="142" width="75.4" height="30" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="680.1" y="161">E0〜FC</text>
  </g>

  <!-- Row3: Shift_JIS 2バイト目 -->
  <text x="60" y="206" font-size="13" fill="#333">Shift_JIS: 2バイト目</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <rect x="226.4" y="212" width="163.8" height="30" fill="#f2c1b6" stroke="#d7301f" stroke-width="1.5"/>
    <text x="308.3" y="231">40〜7E</text>
    <rect x="392.8" y="212" width="325" height="30" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="555.3" y="231">80〜FC</text>
  </g>
  <text x="226.4" y="260" font-size="12" fill="#d7301f">↑ 0x40〜0x7E はASCIIの図形文字と同じ値(自己同期性がない原因)</text>

  <!-- Row4: EUC-JP -->
  <text x="60" y="292" font-size="13" fill="#333">EUC-JP (日本語のバイトはすべて0x80以上)</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <rect x="60" y="298" width="332.8" height="30" fill="#e8e8e8" stroke="#999999"/>
    <text x="226.4" y="317">ASCII (1バイト文字)</text>
    <rect x="429.2" y="298" width="5" height="30" fill="#2166ac" stroke="#2166ac"/>
    <text x="431" y="345" fill="#2166ac">SS2 (0x8E)</text>
    <line x1="431.7" y1="330" x2="431.7" y2="336" stroke="#2166ac"/>
    <rect x="478.6" y="298" width="244.4" height="30" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="600.8" y="317">日本語の1・2バイト目 A1〜FE</text>
  </g>

  <!-- 凡例 -->
  <g font-size="12" fill="#333333">
    <rect x="60" y="376" width="14" height="14" fill="#e8e8e8" stroke="#999999"/>
    <text x="80" y="388">0x80未満(ASCIIと同じ領域)</text>
    <rect x="270" y="376" width="14" height="14" fill="#b9d0e8" stroke="#2166ac"/>
    <text x="290" y="388">0x80以上(日本語文字に使用)</text>
    <rect x="490" y="376" width="14" height="14" fill="#f2c1b6" stroke="#d7301f"/>
    <text x="510" y="388">0x80未満なのに2バイト文字の一部</text>
    <text x="60" y="416" fill="#555">※ 横軸はバイトの値(16進)。ISO-2022-JPはすべてのバイトが0x80未満(モード切替コードで区別)。</text>
  </g>
</svg>
