<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">UTF-16のバイト順とUTF-8</title>
<desc id="desc">「あ」U+3042をUTF-16で保存すると、16ビットの値0x3042を2バイトに分けるため、30 42（ビッグエンディアン）と42 30（リトルエンディアン）の2通りの並べ方がある。UTF-8はE3 81 82というバイトの順番そのものを規格が決めているので、並べ方の選択がない。</desc>
<rect width="800" height="420" fill="#ffffff"/>
<text x="24" y="36" font-size="20" fill="#233647" font-weight="700">「あ」（U+3042）をファイルに書くとき</text>
<!-- 番地 -->
<g font-size="14" fill="#5a6b7b" text-anchor="middle">
  <text x="420" y="74">1バイト目</text>
  <text x="500" y="74">2バイト目</text>
  <text x="580" y="74">3バイト目</text>
</g>
<!-- UTF-16 の説明 -->
<rect x="24" y="86" width="752" height="184" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="44" y="116" font-size="16" fill="#233647">UTF-16：16ビットの数 <tspan font-family="Menlo,Consolas,monospace" font-weight="700">0x3042</tspan> を2バイトに分けて並べる</text>
<g font-family="Menlo,Consolas,monospace" font-size="20" text-anchor="middle">
  <!-- BE -->
  <rect x="384" y="134" width="72" height="40" rx="4" fill="#dbe8f5" stroke="#2166ac"/>
  <text x="420" y="161" fill="#2166ac" font-weight="700">30</text>
  <rect x="464" y="134" width="72" height="40" rx="4" fill="#fbe3de" stroke="#d7301f"/>
  <text x="500" y="161" fill="#d7301f" font-weight="700">42</text>
  <!-- LE -->
  <rect x="384" y="206" width="72" height="40" rx="4" fill="#fbe3de" stroke="#d7301f"/>
  <text x="420" y="233" fill="#d7301f" font-weight="700">42</text>
  <rect x="464" y="206" width="72" height="40" rx="4" fill="#dbe8f5" stroke="#2166ac"/>
  <text x="500" y="233" fill="#2166ac" font-weight="700">30</text>
</g>
<g font-size="15" fill="#233647">
  <text x="44" y="160">ビッグエンディアン（BE）</text>
  <text x="44" y="182" font-size="14" fill="#5a6b7b">上位バイトが先。人が読む順</text>
  <text x="44" y="232">リトルエンディアン（LE）</text>
  <text x="44" y="254" font-size="14" fill="#5a6b7b">下位バイトが先。x86などのCPUの順</text>
  <text x="556" y="160" fill="#5a6b7b">BOMは FE FF</text>
  <text x="556" y="232" fill="#5a6b7b">BOMは FF FE</text>
</g>
<!-- UTF-8 -->
<rect x="24" y="286" width="752" height="112" rx="10" fill="#ffffff" stroke="#c4cfd6"/>
<text x="44" y="316" font-size="16" fill="#233647">UTF-8：規格が1バイトずつの並びそのものを決めている</text>
<g font-family="Menlo,Consolas,monospace" font-size="20" text-anchor="middle" font-weight="700" fill="#233647">
  <rect x="384" y="334" width="72" height="40" rx="4" fill="#f2f5f7" stroke="#5a6b7b"/>
  <text x="420" y="361">E3</text>
  <rect x="464" y="334" width="72" height="40" rx="4" fill="#f2f5f7" stroke="#5a6b7b"/>
  <text x="500" y="361">81</text>
  <rect x="544" y="334" width="72" height="40" rx="4" fill="#f2f5f7" stroke="#5a6b7b"/>
  <text x="580" y="361">82</text>
</g>
<text x="44" y="360" font-size="15" fill="#233647">どの環境でもこの順</text>
<text x="44" y="382" font-size="14" fill="#5a6b7b">先頭から1バイトずつ読むので、並べ方の選択がない</text>
</svg>
