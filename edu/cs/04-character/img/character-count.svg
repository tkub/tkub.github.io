<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" width="960" height="325" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">一文字の数え方</title><desc id="desc">合成済みのがはU+304CでUTF-8の3バイト。かと結合濁点はU+304B U+3099で6バイト。どちらも通常は1つの書記素クラスタとして数える。</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" text-anchor="start" font-weight="700">見た目が同じでも、「長さ」が違うことがある</text>
<text x="35" y="96" font-size="19" fill="#235e85" text-anchor="start">表示例</text>
<text x="160" y="96" font-size="19" fill="#235e85" text-anchor="start">コードポイント列</text>
<text x="525" y="96" font-size="19" fill="#235e85" text-anchor="start">個数</text>
<text x="730" y="96" font-size="19" fill="#235e85" text-anchor="start">UTF-8 の量</text>
<text x="58" y="158" font-size="32" fill="#233647" text-anchor="start">が</text>
<text x="160" y="158" font-size="25" fill="#233647" text-anchor="start">U+304C</text>
<text x="525" y="158" font-size="23" fill="#233647" text-anchor="start">1個</text>
<text x="730" y="158" font-size="23" fill="#233647" text-anchor="start">3バイト</text>
<text x="58" y="226" font-size="32" fill="#233647" text-anchor="start">が</text>
<text x="160" y="226" font-size="25" fill="#233647" text-anchor="start">U+304B  U+3099</text>
<text x="525" y="226" font-size="23" fill="#233647" text-anchor="start">2個</text>
<text x="730" y="226" font-size="23" fill="#233647" text-anchor="start">6バイト</text>
<text x="28" y="286" font-size="18" fill="#233647" text-anchor="start">どちらも通常は1つの書記素クラスタ。文字数を扱うときは、数える単位を決める。</text>
</svg>
