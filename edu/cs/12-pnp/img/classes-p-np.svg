<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" width="460" height="350" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">PとNPの包含関係</title><desc id="desc">NPの楕円の中にPの楕円がある。Pにはオイラー路の存在判定や素数判定、Pの外側のNPにはハミルトン路の存在判定やSATが入ると予想される。</desc><rect width="100%" height="100%" fill="white"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d7301f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#233647"/></marker></defs>
<ellipse cx="230" cy="165" rx="205" ry="135" fill="#eaf1f8" stroke="#2166ac" stroke-width="2.6"/>
<ellipse cx="230" cy="220" rx="120" ry="62" fill="#c6dbef" stroke="#2166ac" stroke-width="2.6"/>
<text x="230.0" y="68.0" font-size="26" fill="#2166ac" text-anchor="middle" font-weight="700">NP</text>
<text x="230.0" y="100.0" font-size="15" fill="#233647" text-anchor="middle">ハミルトン路の存在判定、SAT など</text>
<text x="230.0" y="213.0" font-size="24" fill="#1c3d5f" text-anchor="middle" font-weight="700">P</text>
<text x="230.0" y="240.0" font-size="14" fill="#233647" text-anchor="middle">オイラー路の存在判定、</text>
<text x="230.0" y="258.0" font-size="14" fill="#233647" text-anchor="middle">素数判定 など</text>
<text x="230.0" y="332.0" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">P≠NP と予想される場合</text>
</svg>
