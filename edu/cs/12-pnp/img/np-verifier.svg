<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" width="820" height="345" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">NPの検証のしくみ</title><desc id="desc">上段: Yesの入力(ハミルトン路をもつグラフ)には、検証器が多項式時間で受理する証拠(頂点の並び)が少なくとも1つある。下段: Noの入力では、どんな頂点の並びを渡しても検証器はすべて拒否する。</desc><rect width="100%" height="100%" fill="white"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d7301f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#233647"/></marker></defs>
<rect x="15" y="20" width="235" height="64" rx="9" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.6"/>
<text x="132.5" y="47.0" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">Yes の入力</text>
<text x="132.5" y="71.0" font-size="15" fill="#5a6b7b" text-anchor="middle">ハミルトン路をもつグラフ</text>
<rect x="15" y="100" width="235" height="50" rx="9" fill="white" stroke="#c4cfd6" stroke-width="1.6"/>
<text x="132.5" y="131.0" font-size="16" fill="#233647" text-anchor="middle">証拠: 頂点の並び</text>
<line x1="250" y1="52" x2="300" y2="80" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<line x1="250" y1="125" x2="300" y2="96" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<rect x="305" y="52" width="190" height="72" rx="9" fill="#dbe7f3" stroke="#2166ac" stroke-width="1.6"/>
<text x="400.0" y="83.0" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">検証器</text>
<text x="400.0" y="107.0" font-size="15" fill="#5a6b7b" text-anchor="middle">多項式時間で確認</text>
<line x1="495" y1="88" x2="535" y2="88" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<rect x="540" y="58" width="115" height="60" rx="9" fill="white" stroke="#2166ac" stroke-width="2.2"/>
<text x="597.5" y="95.0" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">受理</text>
<text x="668.0" y="82.0" font-size="16" fill="#5a6b7b" text-anchor="start">受理される証拠が</text>
<text x="668.0" y="104.0" font-size="16" fill="#5a6b7b" text-anchor="start">少なくとも1つある</text>
<rect x="15" y="195" width="235" height="64" rx="9" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.6"/>
<text x="132.5" y="222.0" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">No の入力</text>
<text x="132.5" y="246.0" font-size="15" fill="#5a6b7b" text-anchor="middle">ハミルトン路をもたないグラフ</text>
<rect x="15" y="275" width="235" height="50" rx="9" fill="white" stroke="#c4cfd6" stroke-width="1.6"/>
<text x="132.5" y="306.0" font-size="16" fill="#233647" text-anchor="middle">どんな頂点の並びでも</text>
<line x1="250" y1="227" x2="300" y2="255" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<line x1="250" y1="300" x2="300" y2="271" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<rect x="305" y="227" width="190" height="72" rx="9" fill="#dbe7f3" stroke="#2166ac" stroke-width="1.6"/>
<text x="400.0" y="258.0" font-size="17" fill="#233647" text-anchor="middle" font-weight="700">検証器</text>
<text x="400.0" y="282.0" font-size="15" fill="#5a6b7b" text-anchor="middle">多項式時間で確認</text>
<line x1="495" y1="263" x2="535" y2="263" stroke="#233647" stroke-width="2" marker-end="url(#ag)"/>
<rect x="540" y="233" width="115" height="60" rx="9" fill="white" stroke="#d7301f" stroke-width="2.2"/>
<text x="597.5" y="270.0" font-size="18" fill="#d7301f" text-anchor="middle" font-weight="700">すべて拒否</text>
<text x="668.0" y="257.0" font-size="16" fill="#5a6b7b" text-anchor="start">受理される証拠は</text>
<text x="668.0" y="279.0" font-size="16" fill="#5a6b7b" text-anchor="start">1つもない</text>
</svg>
