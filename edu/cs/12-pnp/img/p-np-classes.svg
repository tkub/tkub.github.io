<svg xml:lang="ja" lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>

  <!-- ===== left panel: P != NP ===== -->
  <g>
    <!-- NP-hard region (extends above NP) -->
    <ellipse cx="190" cy="185" rx="130" ry="120" fill="#fdeae5" stroke="#d7301f" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="190" y="105" font-size="17" text-anchor="middle" fill="#d7301f" font-weight="bold">NP困難</text>

    <!-- NP -->
    <ellipse cx="190" cy="320" rx="145" ry="135" fill="#eef4fa" fill-opacity="0.85" stroke="#2166ac" stroke-width="2.5"/>
    <text x="190" y="330" font-size="17" text-anchor="middle" fill="#2166ac" font-weight="bold">NP</text>

    <!-- NP-complete = intersection band -->
    <ellipse cx="190" cy="245" rx="88" ry="38" fill="#f6c9bd" stroke="#d7301f" stroke-width="2"/>
    <text x="190" y="251" font-size="16" text-anchor="middle" fill="#a02010" font-weight="bold">NP完全</text>

    <!-- P -->
    <ellipse cx="190" cy="392" rx="85" ry="48" fill="#c6dbef" stroke="#2166ac" stroke-width="2"/>
    <text x="190" y="399" font-size="16" text-anchor="middle" fill="#17457e" font-weight="bold">P</text>

    <!-- halting problem -->
    <circle cx="190" cy="135" r="5" fill="#d7301f"/>
    <text x="205" y="140" font-size="14" fill="#333">停止性問題</text>
    <text x="205" y="158" font-size="12" fill="#666">（NPの外のNP困難）</text>

    <text x="190" y="482" font-size="17" text-anchor="middle" fill="#333" font-weight="bold">P≠NPの場合（多数派の予想）</text>
  </g>

  <!-- divider -->
  <line x1="380" y1="40" x2="380" y2="460" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===== right panel: P = NP ===== -->
  <g>
    <!-- NP-hard region -->
    <ellipse cx="570" cy="205" rx="125" ry="140" fill="#fdeae5" stroke="#d7301f" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="570" y="110" font-size="17" text-anchor="middle" fill="#d7301f" font-weight="bold">NP困難</text>

    <!-- P = NP = NP-complete -->
    <ellipse cx="570" cy="345" rx="130" ry="105" fill="#c6dbef" fill-opacity="0.9" stroke="#2166ac" stroke-width="2.5"/>
    <text x="570" y="340" font-size="17" text-anchor="middle" fill="#17457e" font-weight="bold">P = NP</text>
    <text x="570" y="365" font-size="15" text-anchor="middle" fill="#17457e">= NP完全</text>

    <!-- halting problem -->
    <circle cx="570" cy="145" r="5" fill="#d7301f"/>
    <text x="585" y="150" font-size="14" fill="#333">停止性問題</text>

    <text x="570" y="482" font-size="17" text-anchor="middle" fill="#333" font-weight="bold">P=NPの場合</text>
  </g>

  <!-- title -->
  <text x="30" y="32" font-size="16" fill="#333" font-weight="bold">計算量クラスの包含関係</text>
</svg>
