<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">多項式時間還元の向き</title><desc id="desc">SATからクリーク、クリークから独立集合へ入力を多項式時間で変換する。右側を多項式時間で解く方法があれば左側も解ける。NP完全性には還元先がNPに属することも必要。</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="36" font-size="24" fill="#233647" text-anchor="start" font-weight="700">還元の矢印は「入力を変換する向き」</text>
<rect x="25" y="80" width="230" height="90" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="140" y="116" font-size="24" fill="#235e85" text-anchor="middle" font-weight="700">SAT</text>
<text x="140" y="150" font-size="19" fill="#233647" text-anchor="middle">論理式 f</text>
<rect x="365" y="80" width="230" height="90" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="480" y="116" font-size="24" fill="#235e85" text-anchor="middle" font-weight="700">クリーク</text>
<text x="480" y="150" font-size="19" fill="#233647" text-anchor="middle">グラフ G と k</text>
<rect x="705" y="80" width="230" height="90" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="820" y="116" font-size="24" fill="#235e85" text-anchor="middle" font-weight="700">独立集合</text>
<text x="820" y="150" font-size="19" fill="#233647" text-anchor="middle">G の補グラフと k</text>
<line x1="267" y1="125" x2="352" y2="125" stroke="#235e85" stroke-width="2"/>
<path d="M 343 120 L 352 125 L 343 130" fill="none" stroke="#235e85" stroke-width="2"/>
<text x="309" y="105" font-size="15" fill="#235e85" text-anchor="middle">多項式時間</text>
<line x1="607" y1="125" x2="692" y2="125" stroke="#235e85" stroke-width="2"/>
<path d="M 683 120 L 692 125 L 683 130" fill="none" stroke="#235e85" stroke-width="2"/>
<text x="649" y="105" font-size="15" fill="#235e85" text-anchor="middle">多項式時間</text>
<text x="28" y="214" font-size="21" fill="#233647" text-anchor="start">右側を速く解けるなら、変換してから解くことで左側も速く解ける。</text>
<text x="28" y="252" font-size="18" fill="#233647" text-anchor="start">NP完全性の証明には、還元先も NP に属することを別に確かめる。</text>
</svg>
