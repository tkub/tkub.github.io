<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">クリークと独立集合</title><desc id="desc">同じ5頂点を左右で同じ位置に置き、10組すべての辺の有無を反転。左のABCはクリーク、右のABCは独立集合。外部の頂点への辺は独立集合の条件に関係しない。</desc><rect width="100%" height="100%" fill="white"/>
<text x="28" y="35" font-size="24" fill="#233647" text-anchor="start" font-weight="700">辺の有無を反転する。頂点は変えない。</text>
<text x="190" y="85" font-size="21" fill="#235e85" text-anchor="middle">元のグラフ G</text>
