<text x="675" y="433" font-size="18" fill="#233647" text-anchor="start">対応する4クリークもない。</text>
<text x="28" y="503" font-size="17" fill="#233647" text-anchor="start">線が交差するだけの場所は頂点ではありません。頂点は丸で示した8個です。</text>
