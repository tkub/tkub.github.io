<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" width="960" height="535" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">解のない式から作ったグラフ</title><desc id="desc">4節のグラフ。8頂点と16辺。右の表で4通りの割り当てそれぞれに偽になる節があることを示す。4クリークは存在しない。</desc><rect width="100%" height="100%" fill="white"/>
