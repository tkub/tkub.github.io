<text x="252.0" y="482.5" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">5</text>
<circle cx="330.0" cy="448.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="330.0" y="454.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">a</text>
<text x="358.0" y="454.5" font-size="17" fill="#5a6b7b">3</text>
<circle cx="330.0" cy="504.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="330.0" y="510.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">d</text>
<text x="358.0" y="510.5" font-size="17" fill="#5a6b7b">2</text>
