<text x="710.0" y="566.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">b</text>
<text x="738.0" y="566.5" font-size="17" fill="#5a6b7b">4</text>
<text x="774.0" y="567.0" font-size="20" fill="#d7301f" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">01</text>
<circle cx="710.0" cy="616.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="710.0" y="622.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">c</text>
