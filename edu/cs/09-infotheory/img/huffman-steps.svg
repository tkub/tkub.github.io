<text x="590.1" y="611.9" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">1</text>
<circle cx="476.0" cy="567.0" r="20" fill="#e8f0f8" stroke="#2166ac" stroke-width="2"/>
<text x="476.0" y="573.5" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">15</text>
<circle cx="554.0" cy="518.0" r="20" fill="#e8f0f8" stroke="#2166ac" stroke-width="2"/>
