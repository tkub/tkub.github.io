<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 840 660" width="840" height="660" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">ハフマン符号の符号木を作る手順</title>
<desc id="desc">記号列 cbaccbcdacadbbc の頻度 a3, b4, c6, d2 から、最小の2つをまとめる操作を3回繰り返す。d と a で5、b と5で9、c と9で15の根ができ、符号語は a=000, d=001, b=01, c=1 となる。</desc>
<rect width="840" height="660" fill="white"/>
<rect x="8" y="8" width="404" height="314" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="24" y="40" font-size="20" fill="#1c3d5f" font-weight="700">① 記号ごとにノードを作る</text>
<text x="24" y="68" font-size="17" fill="#d7301f">最小の2つ: d(2) と a(3)</text>
<circle cx="330.0" cy="118.0" r="20" fill="white" stroke="#d7301f" stroke-width="3.5"/>
<text x="330.0" y="124.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">a</text>
<text x="358.0" y="124.5" font-size="17" fill="#5a6b7b">3</text>
<circle cx="330.0" cy="174.0" r="20" fill="white" stroke="#d7301f" stroke-width="3.5"/>
<text x="330.0" y="180.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">d</text>
<text x="358.0" y="180.5" font-size="17" fill="#5a6b7b">2</text>
<circle cx="330.0" cy="230.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="330.0" y="236.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">b</text>
<text x="358.0" y="236.5" font-size="17" fill="#5a6b7b">4</text>
<circle cx="330.0" cy="286.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="330.0" y="292.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">c</text>
<text x="358.0" y="292.5" font-size="17" fill="#5a6b7b">6</text>
<rect x="428" y="8" width="404" height="314" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="444" y="40" font-size="20" fill="#1c3d5f" font-weight="700">② d と a をまとめて 5 を作る</text>
<text x="444" y="68" font-size="17" fill="#d7301f">最小の2つ: b(4) と 5</text>
<line x1="672.0" y1="146.0" x2="750.0" y2="118.0" stroke="#233647" stroke-width="2"/>
<line x1="672.0" y1="146.0" x2="750.0" y2="174.0" stroke="#233647" stroke-width="2"/>
<circle cx="672.0" cy="146.0" r="20" fill="#e8f0f8" stroke="#d7301f" stroke-width="3.5"/>
<text x="672.0" y="152.5" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">5</text>
<circle cx="750.0" cy="118.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="750.0" y="124.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">a</text>
<text x="778.0" y="124.5" font-size="17" fill="#5a6b7b">3</text>
<circle cx="750.0" cy="174.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="750.0" y="180.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">d</text>
<text x="778.0" y="180.5" font-size="17" fill="#5a6b7b">2</text>
<circle cx="750.0" cy="230.0" r="20" fill="white" stroke="#d7301f" stroke-width="3.5"/>
<text x="750.0" y="236.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">b</text>
<text x="778.0" y="236.5" font-size="17" fill="#5a6b7b">4</text>
<circle cx="750.0" cy="286.0" r="20" fill="white" stroke="#233647" stroke-width="2"/>
<text x="750.0" y="292.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">c</text>
<text x="778.0" y="292.5" font-size="17" fill="#5a6b7b">6</text>
