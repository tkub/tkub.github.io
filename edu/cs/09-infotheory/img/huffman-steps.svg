<text x="24" y="398" font-size="17" fill="#d7301f">最小の2つ: c(6) と 9</text>
<line x1="174.0" y1="518.0" x2="252.0" y2="476.0" stroke="#233647" stroke-width="2"/>
<line x1="252.0" y1="476.0" x2="330.0" y2="448.0" stroke="#233647" stroke-width="2"/>
<line x1="252.0" y1="476.0" x2="330.0" y2="504.0" stroke="#233647" stroke-width="2"/>
