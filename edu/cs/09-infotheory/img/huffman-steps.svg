<text x="358.0" y="566.5" font-size="17" fill="#5a6b7b">4</text>
<circle cx="330.0" cy="616.0" r="20" fill="white" stroke="#d7301f" stroke-width="3.5"/>
<text x="330.0" y="622.5" font-size="20" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">c</text>
<text x="358.0" y="622.5" font-size="17" fill="#5a6b7b">6</text>
<rect x="428" y="338" width="404" height="314" rx="10" fill="#f2f5f7" stroke="#c4cfd6"/>
<text x="444" y="370" font-size="20" fill="#1c3d5f" font-weight="700">④ c と 9 をまとめて根 15 を作る</text>
<text x="444" y="398" font-size="17" fill="#5a6b7b">上の辺に 0、下の辺に 1 を割り当てる</text>
<line x1="476.0" y1="567.0" x2="554.0" y2="518.0" stroke="#233647" stroke-width="2"/>
<text x="507.6" y="537.3" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<line x1="554.0" y1="518.0" x2="632.0" y2="476.0" stroke="#233647" stroke-width="2"/>
<text x="586.4" y="491.3" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<line x1="632.0" y1="476.0" x2="710.0" y2="448.0" stroke="#233647" stroke-width="2"/>
<text x="666.3" y="455.5" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<line x1="632.0" y1="476.0" x2="710.0" y2="504.0" stroke="#233647" stroke-width="2"/>
<text x="666.3" y="509.8" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">1</text>
<line x1="554.0" y1="518.0" x2="710.0" y2="560.0" stroke="#233647" stroke-width="2"/>
