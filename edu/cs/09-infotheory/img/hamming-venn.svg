<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">ハミング符号(7,4)の符号化と1ビット誤りの訂正</title>
<desc id="desc">データ4ビット d1..d4 を3つの円の重なりに置き、各円の中の1の個数が偶数になるようにパリティビット p1, p2, p3 を決める。データ1011では p1=0, p2=1, p3=0。受信側で d3 が反転すると円Bと円Cだけが奇数になり、その2つだけに共通する d3 が誤りと分かる。</desc>
<rect width="880" height="470" fill="white"/>
<text x="220" y="34" font-size="20" fill="#1c3d5f" text-anchor="middle" font-weight="700">① 送信: データ 1011 にパリティを付ける</text>
<text x="660" y="34" font-size="20" fill="#1c3d5f" text-anchor="middle" font-weight="700">② 受信: d3 が反転していた</text>
<circle cx="171.3" cy="182.0" r="92" fill="#e8f0f8" fill-opacity="0.45" stroke="#2166ac" stroke-width="2"/>
<circle cx="268.7" cy="182.0" r="92" fill="#e8f0f8" fill-opacity="0.45" stroke="#2166ac" stroke-width="2"/>
<circle cx="220.0" cy="266.0" r="92" fill="#e8f0f8" fill-opacity="0.45" stroke="#2166ac" stroke-width="2"/>
<text x="71.9" y="118.1" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">円A</text>
<text x="368.1" y="118.1" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">円B</text>
<text x="312.0" y="360.3" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">円C</text>
<text x="125" y="144" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="125" y="164" font-size="16" fill="#5a6b7b" text-anchor="middle">p1</text>
<text x="315" y="144" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="315" y="164" font-size="16" fill="#5a6b7b" text-anchor="middle">p2</text>
<text x="220" y="319" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="220" y="339" font-size="16" fill="#5a6b7b" text-anchor="middle">p3</text>
<text x="220" y="142" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="220" y="162" font-size="16" fill="#233647" text-anchor="middle">d1</text>
<text x="162" y="246" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="162" y="266" font-size="16" fill="#233647" text-anchor="middle">d2</text>
<text x="278" y="246" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="278" y="266" font-size="16" fill="#233647" text-anchor="middle">d3</text>
<text x="220" y="210" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="220" y="230" font-size="16" fill="#233647" text-anchor="middle">d4</text>
<circle cx="611.3" cy="182.0" r="92" fill="#e8f0f8" fill-opacity="0.45" stroke="#2166ac" stroke-width="2"/>
<circle cx="708.7" cy="182.0" r="92" fill="#fbe3df" fill-opacity="0.45" stroke="#d7301f" stroke-width="3"/>
<circle cx="660.0" cy="266.0" r="92" fill="#fbe3df" fill-opacity="0.45" stroke="#d7301f" stroke-width="3"/>
<text x="511.9" y="118.1" font-size="18" fill="#2166ac" text-anchor="middle" font-weight="700">円A</text>
<text x="808.1" y="118.1" font-size="18" fill="#d7301f" text-anchor="middle" font-weight="700">円B</text>
<text x="752.0" y="360.3" font-size="18" fill="#d7301f" text-anchor="middle" font-weight="700">円C</text>
<text x="565" y="144" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="565" y="164" font-size="16" fill="#5a6b7b" text-anchor="middle">p1</text>
<text x="755" y="144" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="755" y="164" font-size="16" fill="#5a6b7b" text-anchor="middle">p2</text>
<text x="660" y="319" font-size="25" fill="#5a6b7b" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="660" y="339" font-size="16" fill="#5a6b7b" text-anchor="middle">p3</text>
<text x="660" y="142" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="660" y="162" font-size="16" fill="#233647" text-anchor="middle">d1</text>
<text x="602" y="246" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="602" y="266" font-size="16" fill="#233647" text-anchor="middle">d2</text>
<text x="718" y="246" font-size="25" fill="#d7301f" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">0</text>
<text x="718" y="266" font-size="16" fill="#d7301f" text-anchor="middle">d3</text>
<text x="660" y="210" font-size="25" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1</text>
<text x="660" y="230" font-size="16" fill="#233647" text-anchor="middle">d4</text>
<line x1="440" y1="60" x2="440" y2="370" stroke="#dde5ec" stroke-width="2"/>
<text x="30" y="398" font-size="16.5" fill="#233647">各円の1の個数が偶数になるよう p を決める</text>
<text x="30" y="424" font-size="16.5" fill="#233647">送る7ビット: d1 d2 d3 d4 p1 p2 p3 = <tspan font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">1011010</tspan></text>
<text x="470" y="398" font-size="16.5" fill="#233647">円A: 偶数(○) 円B: 奇数(×) 円C: 奇数(×)</text>
<text x="470" y="424" font-size="16.5" fill="#233647">B と C の内側で A の外側 → <tspan fill="#d7301f" font-weight="700">d3 を反転して訂正</tspan></text>
</svg>
