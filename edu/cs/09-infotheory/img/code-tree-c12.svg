<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" lang="ja" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">符号 C1 と C2 の符号木</title>
<desc id="desc">C1 は a=0, b=100, c=11, d=101 で、すべての記号が葉にある。C2 は a=0, b=11, c=100, d=01 で、a が d への途中のノードにあり葉ではない。</desc>
<rect width="860" height="360" fill="white"/>
<text x="20" y="36" font-size="21" fill="#1c3d5f" font-weight="700">C<tspan baseline-shift='sub' font-size='15'>1</tspan> の符号木(瞬時符号)</text>
<text x="20" y="64" font-size="17" fill="#5a6b7b">記号はすべて葉にある</text>
<line x1="40.0" y1="192.5" x2="145.0" y2="110.0" stroke="#233647" stroke-width="2"/>
<text x="83.9" y="146.9" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
