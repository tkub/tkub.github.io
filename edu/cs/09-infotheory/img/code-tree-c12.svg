<text x="800.0" y="257.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">100</text>
<circle cx="665.0" cy="320.0" r="21" fill="white" stroke="#233647" stroke-width="2"/>
<text x="665.0" y="327.0" font-size="21" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">b</text>
<text x="695.0" y="327.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">11</text>
<circle cx="560.0" cy="285.0" r="6" fill="#233647"/>
<circle cx="665.0" cy="250.0" r="6" fill="#233647"/>
