<circle cx="455.0" cy="207.5" r="6" fill="#233647"/>
<circle cx="665.0" cy="170.0" r="21" fill="white" stroke="#233647" stroke-width="2"/>
<text x="665.0" y="177.0" font-size="21" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">d</text>
<text x="695.0" y="177.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">01</text>
