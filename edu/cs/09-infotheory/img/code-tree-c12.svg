<text x="192.0" y="317.0" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">1</text>
<line x1="145.0" y1="275.0" x2="250.0" y2="230.0" stroke="#233647" stroke-width="2"/>
<text x="192.0" y="246.3" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<line x1="250.0" y1="230.0" x2="355.0" y2="260.0" stroke="#233647" stroke-width="2"/>
<text x="298.7" y="265.1" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">1</text>
<line x1="250.0" y1="230.0" x2="355.0" y2="200.0" stroke="#233647" stroke-width="2"/>
<text x="298.7" y="208.2" font-size="19" fill="#2166ac" text-anchor="middle" font-weight="700">0</text>
<circle cx="40.0" cy="192.5" r="6" fill="#233647"/>
<circle cx="355.0" cy="260.0" r="21" fill="white" stroke="#233647" stroke-width="2"/>
