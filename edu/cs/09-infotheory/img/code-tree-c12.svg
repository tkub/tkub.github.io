<text x="250.0" y="327.0" font-size="21" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">c</text>
<text x="280.0" y="327.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">11</text>
<circle cx="145.0" cy="275.0" r="6" fill="#233647"/>
<circle cx="250.0" cy="230.0" r="6" fill="#233647"/>
<text x="435" y="36" font-size="21" fill="#1c3d5f" font-weight="700">C<tspan baseline-shift='sub' font-size='15'>2</tspan> の符号木</text>
<text x="435" y="64" font-size="17" fill="#5a6b7b">a が葉でなく、d への途中にある</text>
