<text x="385.0" y="267.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">101</text>
<circle cx="145.0" cy="110.0" r="21" fill="white" stroke="#233647" stroke-width="2"/>
<text x="145.0" y="117.0" font-size="21" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">a</text>
<text x="175.0" y="117.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">0</text>
<circle cx="355.0" cy="200.0" r="21" fill="white" stroke="#233647" stroke-width="2"/>
<text x="355.0" y="207.0" font-size="21" fill="#233647" text-anchor="middle" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace" font-weight="700">b</text>
<text x="385.0" y="207.0" font-size="19" fill="#5a6b7b" text-anchor="start" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">100</text>
