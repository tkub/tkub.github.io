<svg xml:lang="ja" lang="ja" viewBox="0 0 820 290" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
  <!-- 左: C1 の符号木 (瞬時符号) -->
  <text x="205" y="32" text-anchor="middle" font-size="15" fill="#333">C<tspan dy="4" font-size="11">1</tspan><tspan dy="-4"> の符号木(瞬時符号)</tspan></text>
  <!-- 辺 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="50" y1="150" x2="160" y2="80"/>
    <line x1="50" y1="150" x2="160" y2="210"/>
    <line x1="160" y1="210" x2="270" y2="175"/>
    <line x1="160" y1="210" x2="270" y2="240"/>
    <line x1="270" y1="175" x2="380" y2="145"/>
    <line x1="270" y1="175" x2="380" y2="205"/>
  </g>
  <!-- 辺ラベル -->
  <g font-size="14" fill="#2166ac" text-anchor="middle">
    <text x="100" y="105">0</text>
    <text x="100" y="195">1</text>
    <text x="215" y="183">0</text>
    <text x="215" y="238">1</text>
    <text x="325" y="150">0</text>
    <text x="325" y="200">1</text>
  </g>
  <!-- ノード -->
  <circle cx="50" cy="150" r="5" fill="#333"/>
  <circle cx="160" cy="210" r="5" fill="#333"/>
  <circle cx="270" cy="175" r="5" fill="#333"/>
  <g stroke="#333" stroke-width="1.5" fill="#fff">
    <circle cx="160" cy="80" r="15"/>
    <circle cx="270" cy="240" r="15"/>
    <circle cx="380" cy="145" r="15"/>
    <circle cx="380" cy="205" r="15"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="160" y="85">a</text>
    <text x="270" y="245">c</text>
    <text x="380" y="150">b</text>
    <text x="380" y="210">d</text>
  </g>
  <!-- 符号語 -->
  <g font-size="13" fill="#666" font-family="Menlo,Consolas,monospace">
    <text x="182" y="85">0</text>
    <text x="292" y="245">11</text>
    <text x="402" y="150">100</text>
    <text x="402" y="210">101</text>
  </g>

  <!-- 右: C2 の符号木 (一意に復号できない) -->
  <text x="620" y="32" text-anchor="middle" font-size="15" fill="#333">C<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> の符号木(記号aが葉にない)</tspan></text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="470" y1="150" x2="580" y2="85"/>
    <line x1="470" y1="150" x2="580" y2="215"/>
    <line x1="580" y1="85" x2="690" y2="115"/>
    <line x1="580" y1="215" x2="690" y2="185"/>
    <line x1="580" y1="215" x2="690" y2="245"/>
    <line x1="690" y1="185" x2="780" y2="160"/>
  </g>
  <g font-size="14" fill="#2166ac" text-anchor="middle">
    <text x="520" y="108">0</text>
    <text x="520" y="198">1</text>
    <text x="635" y="93">1</text>
    <text x="635" y="192">0</text>
    <text x="635" y="243">1</text>
    <text x="735" y="165">0</text>
  </g>
  <circle cx="470" cy="150" r="5" fill="#333"/>
  <circle cx="580" cy="215" r="5" fill="#333"/>
  <circle cx="690" cy="185" r="5" fill="#333"/>
  <g stroke="#333" stroke-width="1.5" fill="#fff">
    <circle cx="580" cy="85" r="15" stroke="#d7301f" stroke-width="2.5"/>
    <circle cx="690" cy="115" r="15"/>
    <circle cx="690" cy="245" r="15"/>
    <circle cx="780" cy="160" r="15"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="580" y="90" fill="#d7301f">a</text>
    <text x="690" y="120">d</text>
    <text x="690" y="250">b</text>
    <text x="780" y="165">c</text>
  </g>
  <g font-size="13" fill="#666" font-family="Menlo,Consolas,monospace">
    <text x="560" y="62">0</text>
    <text x="712" y="120">01</text>
    <text x="712" y="250">11</text>
    <text x="758" y="138">100</text>
  </g>
</svg>
