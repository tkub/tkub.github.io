<svg xml:lang="ja" lang="ja" viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif">
  <!-- 辺 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="120" y1="180" x2="260" y2="128"/>
    <line x1="120" y1="180" x2="520" y2="232"/>
    <line x1="260" y1="128" x2="390" y2="82"/>
    <line x1="260" y1="128" x2="520" y2="172"/>
    <line x1="390" y1="82" x2="520" y2="52"/>
    <line x1="390" y1="82" x2="520" y2="112"/>
  </g>
  <!-- 辺ラベル -->
  <g font-size="14" fill="#2166ac" text-anchor="middle">
    <text x="190" y="146">0</text>
    <text x="320" y="219">1</text>
    <text x="325" y="98">0</text>
    <text x="390" y="158">1</text>
    <text x="455" y="58">0</text>
    <text x="455" y="108">1</text>
  </g>
  <!-- 内部ノード (併合ノード, 数字は頻度の和) -->
  <g stroke="#2166ac" stroke-width="1.5" fill="#fff">
    <circle cx="120" cy="180" r="16"/>
    <circle cx="260" cy="128" r="16"/>
    <circle cx="390" cy="82" r="16"/>
  </g>
  <g font-size="13" fill="#2166ac" text-anchor="middle">
    <text x="120" y="185">15</text>
    <text x="260" y="133">9</text>
    <text x="390" y="87">5</text>
  </g>
  <!-- 葉 -->
  <g stroke="#333" stroke-width="1.5" fill="#fff">
    <circle cx="520" cy="52" r="16"/>
    <circle cx="520" cy="112" r="16"/>
    <circle cx="520" cy="172" r="16"/>
    <circle cx="520" cy="232" r="16"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="520" y="57">a</text>
    <text x="520" y="117">d</text>
    <text x="520" y="177">b</text>
    <text x="520" y="237">c</text>
  </g>
  <!-- 頻度 -->
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="520" y="84">3</text>
    <text x="520" y="144">2</text>
    <text x="520" y="204">4</text>
    <text x="520" y="264">6</text>
  </g>
  <!-- 符号語 -->
  <g font-size="14" fill="#d7301f" font-family="Menlo,Consolas,monospace">
    <text x="556" y="57">000</text>
    <text x="556" y="117">001</text>
    <text x="556" y="177">01</text>
    <text x="556" y="237">1</text>
  </g>
</svg>
