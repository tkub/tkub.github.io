<line x1="772.0" y1="74.0" x2="772.0" y2="376.0" stroke="#1c3d5f" stroke-width="1.5"/>
<line x1="762.0" y1="74.0" x2="772.0" y2="74.0" stroke="#1c3d5f" stroke-width="1.5"/>
<line x1="762.0" y1="376.0" x2="772.0" y2="376.0" stroke="#1c3d5f" stroke-width="1.5"/>
<text x="760.0" y="396.0" font-size="16" fill="#1c3d5f" text-anchor="end">約 n 段</text>
<text x="600.0" y="432.0" font-size="18" fill="#d7301f" text-anchor="middle" font-weight="700">(n−1)+(n−2)+⋯+1 ＝ n(n−1)/2 回</text>
