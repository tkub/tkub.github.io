<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif">
<title id="title">クイックソートの再帰木：平衡分割と偏った分割</title><desc id="desc">左は基準値が毎回ほぼ半分に分ける場合で、各段の比較は合計約n回、段数は約log2 n段なので、全体で約 n log2 n 回。右は基準値が毎回最小値になる場合で、1段ごとに1個しか減らず、比較は(n-1)+(n-2)+…+1 = n(n-1)/2 回。</desc>
