<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">8ビット(容量256)での失敗例 100+100</title><desc id="desc">容量256のメスシリンダーで水位100どうしを注ぐと水位200。128以上は負の領域なので空き56を読み−56になる。正しい答え200は範囲−128〜127の外なので桁あふれ。</desc><defs><pattern id="hred" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fdeeec"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d7301f" stroke-width="1.1" stroke-opacity="0.55"/></pattern></defs>
