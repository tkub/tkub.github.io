<text x="366" y="136" font-size="15" fill="#d7301f" text-anchor="start" font-weight="bold">256−200=56</text>
<text x="352" y="157" font-size="15" fill="#d7301f" text-anchor="start">128以上は</text>
<text x="352" y="177" font-size="15" fill="#d7301f" text-anchor="start">負の領域</text>
