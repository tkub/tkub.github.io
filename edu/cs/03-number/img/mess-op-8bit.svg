<text x="551" y="209" font-size="32" fill="#d7301f" text-anchor="middle" font-weight="bold">−56 ?</text>
<rect x="18" y="314" width="604" height="36" rx="8" fill="#f2f5f7" stroke="none" stroke-width="1.5"/>
<text x="320" y="338" font-size="16" fill="#333" text-anchor="middle">水位200は境目の128を越えている → 空き56を読んで −56</text>
<text x="320" y="378" font-size="16" fill="#d7301f" text-anchor="middle" font-weight="bold">正しい答え200が、表せる範囲(−128〜127)の外にある → 桁あふれ</text>
</svg>
