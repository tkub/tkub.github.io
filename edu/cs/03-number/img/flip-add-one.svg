<text x="532" y="172" font-size="15" fill="#333" text-anchor="start">最後に1を足す</text>
<text x="532" y="200" font-size="20" fill="#2166ac" text-anchor="start" font-weight="bold" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">562+1=563</text>
<text x="24" y="278" font-size="18" fill="#2166ac" text-anchor="start" font-weight="bold">2進法: 4ビットで −5 を表す(2⁴−5)</text>
<text x="696" y="278" font-size="16" fill="#5a6b7b" text-anchor="end">10000−0101 = (1111−0101)+1</text>
