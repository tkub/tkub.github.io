<text x="532" y="412" font-size="15" fill="#333" text-anchor="start">最後に1を足す</text>
<text x="532" y="440" font-size="20" fill="#2166ac" text-anchor="start" font-weight="bold" font-family="'Menlo','Consolas','DejaVu Sans Mono',monospace">1010+1=1011</text>
<rect x="24" y="488" width="672" height="52" rx="8" fill="#f2f5f7" stroke="none" stroke-width="1.5"/>
<text x="360" y="512" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">2ⁿ − x = ((2ⁿ − 1) − x) + 1</text>
<text x="360" y="532" font-size="15" fill="#333" text-anchor="middle">2ⁿ − 1 = 11…1 からの引き算では、繰り下がりが決して起きない</text>
