<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">「各ビットを反転して1を足す」と2の補数が求められる理由</title><desc id="desc">1000−437は999−437に1を足せば求められ、999からの引き算は各桁9−その桁で繰り下がりがない。2進法の10000−0101も1111−0101に1を足せばよく、1111からの引き算は各ビットの反転になる。</desc>
<rect width="720" height="560" fill="white"/>
<rect x="2" y="2" width="716" height="556" rx="12" fill="#fcfdfe" stroke="#dde5ec" stroke-width="1.5"/>
<text x="24" y="38" font-size="18" fill="#2166ac" text-anchor="start" font-weight="bold">10進法: 1000円出して437円の買い物</text>
<text x="696" y="38" font-size="16" fill="#5a6b7b" text-anchor="end">1000−437 = (999−437)+1</text>
<rect x="24" y="56" width="250" height="170" rx="10" fill="#f6f7f9" stroke="#c4cfd6" stroke-width="1.5"/>
