<rect x="40" y="151" width="70" height="24" rx="12" fill="#d7301f" stroke="none" stroke-width="1.5"/>
<text x="75" y="169" font-size="14" fill="white" text-anchor="middle" font-weight="bold">符号部</text>
<text x="124" y="169" font-size="16" fill="#222" text-anchor="start">0 → 正の数（1なら負の数）</text>
<rect x="40" y="191" width="70" height="24" rx="12" fill="#2166ac" stroke="none" stroke-width="1.5"/>
<text x="75" y="209" font-size="14" fill="white" text-anchor="middle" font-weight="bold">指数部</text>
<text x="124" y="209" font-size="16" fill="#222" text-anchor="start">01110<tspan font-size="10.9" baseline-shift="-25%">(2)</tspan> = 14 → 指数は 14 − 15 = −1</text>
<rect x="40" y="231" width="70" height="24" rx="12" fill="#5a6b7b" stroke="none" stroke-width="1.5"/>
<text x="75" y="249" font-size="14" fill="white" text-anchor="middle" font-weight="bold">仮数部</text>
<text x="124" y="249" font-size="16" fill="#222" text-anchor="start">0011000000 → 先頭の1を補って 1.0011<tspan font-size="10.9" baseline-shift="-25%">(2)</tspan></text>
<rect x="40" y="282" width="640" height="56" rx="10" fill="#f2f5f7" stroke="#c4cfd6" stroke-width="1.5"/>
<text x="360" y="318" font-size="20" fill="#1c3d5f" text-anchor="middle" font-weight="bold">値 = +1.0011<tspan font-size="13.6" baseline-shift="-25%">(2)</tspan> × 2<tspan font-size="13.6" baseline-shift="45%">−1</tspan> = 0.10011<tspan font-size="13.6" baseline-shift="-25%">(2)</tspan> = 0.59375</text>
</svg>
