<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title desc" font-family="'Hiragino Sans','Noto Sans CJK JP','Yu Gothic',sans-serif"><title id="title">IEEE 754 半精度の格納形式と0.59375のビット列</title><desc id="desc">16ビットを符号部1ビット、指数部5ビット、仮数部10ビットに分ける。0.59375は0 01110 0011000000。指数部01110は14で、15を引いて指数−1。仮数部は先頭の1を補って1.0011。値は1.0011(2)×2^−1=0.59375。</desc>
